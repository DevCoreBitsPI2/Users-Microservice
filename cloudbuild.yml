steps:
- name: 'gcr.io/cloud-builders/docker'
  entrypoint: 'bash'
  args:
    - -c
    - |
      docker build -t us-central1-docker.pkg.dev/talent-core-497108/talent-core-repository/users-ms -f dockerfile.prod --platform=linux/amd64 --build-arg DIRECT_URL_USERS_DB=$$DATABASE_URL .
  secretEnv: ['DATABASE_URL']

- name: 'gcr.io/cloud-builders/docker'
  args:
    [
      'push',
      'us-central1-docker.pkg.dev/talent-core-497108/talent-core-repository/users-ms',
    ]

availableSecrets:
  secretManager:
  - versionName: projects/905332316414/secrets/direct_url_users_ms/versions/1
    env: 'DATABASE_URL'

options:
  logging: CLOUD_LOGGING_ONLY
